# OpenSSH servers used by integration tests and by the terminal spike.
#
#   ./test/integration/setup.sh        # generates a throwaway key pair
#   docker compose -f test/integration/docker-compose.yml up -d
#
# password-only: ssh -p 2221 shellvane@localhost   (password: shellvane)
# key-only:      ssh -p 2222 -i test/integration/.keys/id_ed25519 shellvane@localhost
services:
  ssh-password:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: shellvane
      USER_PASSWORD: shellvane
      PASSWORD_ACCESS: "true"
    ports:
      - "127.0.0.1:2221:2222"

  ssh-key:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: shellvane
      PASSWORD_ACCESS: "false"
      PUBLIC_KEY_FILE: /keys/id_ed25519.pub
    volumes:
      - ./.keys:/keys:ro
    ports:
      - "127.0.0.1:2222:2222"
