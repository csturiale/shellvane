<app-modal *transloco="let t" [heading]="heading()" (closed)="cancelled.emit()">
  <p class="message">{{ message() }}</p>
  <ng-container modal-actions>
    <button type="button" class="btn" (click)="cancelled.emit()">{{ t('common.cancel') }}</button>
    @if (secondaryLabel()) {
      <button type="button" class="btn" (click)="secondary.emit()">{{ secondaryLabel() }}</button>
    }
    <button type="button" class="btn" [class.danger]="danger()" [class.primary]="!danger()" (click)="confirmed.emit()">
      {{ confirmLabel() }}
    </button>
  </ng-container>
</app-modal>
