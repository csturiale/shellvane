<div *transloco="let t" class="player">
  @if (error()) {
    <p class="error" role="alert">{{ t('logs.badRecording') }}</p>
  }
  <div #screen class="screen"></div>
  @if (kind() === 'recording' && cast()) {
    <div class="controls">
      <button type="button" class="icon" [attr.aria-label]="t(playing() ? 'logs.pause' : 'logs.play')" (click)="toggle()">
        @if (playing()) {
          <svg lucidePause [size]="16" aria-hidden="true"></svg>
        } @else {
          <svg lucidePlay [size]="16" aria-hidden="true"></svg>
        }
      </button>
      <button type="button" class="icon" [attr.aria-label]="t('logs.restart')" (click)="seek(0)">
        <svg lucideRotateCcw [size]="16" aria-hidden="true"></svg>
      </button>
      <input type="range" min="0" step="0.1" [max]="duration()" [value]="position()" [attr.aria-label]="t('logs.position')" (change)="onSeek($event)" />
      <span class="time">{{ clock(position()) }} / {{ clock(duration()) }}</span>
      <select [attr.aria-label]="t('logs.speed')" (change)="setSpeed($event)">
        @for (s of speeds; track s) {
          <option [value]="s" [selected]="speed() === s">{{ s }}×</option>
        }
      </select>
    </div>
  }
</div>
