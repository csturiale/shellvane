<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shellvane</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Only the app's own code runs here: no inline or remote scripts, no
         plugins, nothing loaded from elsewhere (defense in depth against
         injected content). unsafe-eval: messageformat compiles the translations
         with new Function; wasm-unsafe-eval: the terminal's image decoder. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
